name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Debug SSH
        run: |
          echo "Testing SSH connection..."
          ssh-add -l
          ssh -vvv -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH OK'"

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          cd ${{ secrets.APP_PATH }}

          # Pull latest code
          git pull origin dev

          # Copy .env if not exists
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Build and restart containers
          docker-compose down
          docker-compose build
          docker-compose up -d

          # Wait for containers to be ready
          sleep 5

          # Run Laravel setup inside container
          docker-compose exec -T app composer install --no-dev --optimize-autoloader
          docker-compose exec -T app php artisan key:generate --force
          docker-compose exec -T app php artisan migrate --force
          docker-compose exec -T app php artisan config:cache
          docker-compose exec -T app php artisan route:cache
          docker-compose exec -T app php artisan view:cache

          # Set permissions
          docker-compose exec -T app chown -R www-data:www-data /var/www/html/storage
          docker-compose exec -T app chown -R www-data:www-data /var/www/html/bootstrap/cache

          echo "Deployment completed successfully!"
          EOF
