version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shorturl_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - shorturl_network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: shorturl_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shorturl}
      MYSQL_USER: ${DB_USERNAME:-shorturl}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    networks:
      - shorturl_network

networks:
  shorturl_network:
    driver: bridge

volumes:
  db_data:
